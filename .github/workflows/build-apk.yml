name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'styles.css'
      - 'js/**'
      - 'assets/**'
      - 'media/**'
      - 'main.js'
      - 'preload.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build web assets
        run: node scripts/build.js

      - name: Check meditations bundled
        run: |
          count=$(find www/audios/meditacao -name '*.m4a' | wc -l)
          echo "meditações no apk: $count"
          test "$count" -ge 19
          test -s www/assets/audio-manifest.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy APK
        run: cp android/app/build/outputs/apk/release/app-release.apk sleep-my-angel.apk

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs sleep-my-angel.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: sleep-my-angel-apk
          path: sleep-my-angel.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: sleep my angel v${{ steps.version.outputs.version }}
          body: |
            atualização do sleep my angel v${{ steps.version.outputs.version }}

            - código do app mais limpo e organizado, sem mudar o jeito de usar
            - se o download da atualização falhar, baixe o `sleep-my-angel.apk` aqui na release e instale por cima
          files: sleep-my-angel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

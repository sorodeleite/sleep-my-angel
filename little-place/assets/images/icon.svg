<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ✧ CRECHEZINHA — o ícone do app ✧
       Feito pra ler bem PEQUENININHO (16px na abinha do navegador): formas
       grandes e chapadas, sem letrinha e sem traço fino. A fitinha de
       marcador e o coraçãozinho contam o "diário" numa olhada. ✧

       O grupo "arte" é a arte em si; a moldurinha de pontinhos é enfeite.
       O `scripts/build-icons.mjs` usa só a arte nos ícones "maskable"
       (o Android recorta em círculo: a moldura seria cortada). ✧ -->
  <g id="arte">
    <!-- o caderninho, deitadinho de leve -->
    <g transform="rotate(-7 256 256)">
      <!-- a lombada -->
      <rect x="152" y="112" width="230" height="292" rx="30" fill="#e9b7cb"/>
      <!-- a folhinha -->
      <rect x="182" y="112" width="230" height="292" rx="30" fill="#ffffff"/>
      <!-- a pauta (a última linha é mais curta e para antes do coração) -->
      <g fill="#f0c3d4">
        <rect x="216" y="172" width="164" height="18" rx="9"/>
        <rect x="216" y="222" width="164" height="18" rx="9"/>
        <rect x="216" y="272" width="96" height="18" rx="9"/>
      </g>
      <!-- o coraçãozinho, na folhinha de baixo -->
      <path d="M300 372c-8-20-58-43-58-73 0-21 16-36 36-36 11 0 19 5 25 14 6-9 14-14 25-14 20 0 36 15 36 36 0 30-50 53-58 73z" fill="#ff9dbb"/>
    </g>
    <!-- a fitinha de marcador -->
    <path d="M310 84h46v118l-23-21-23 21z" fill="#ff9dbb"/>
  </g>
</svg>
